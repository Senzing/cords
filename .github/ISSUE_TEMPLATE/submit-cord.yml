name: Submit a CORD file
description: Hand over a new or changed CORD JSONL file without write access to this repository.
title: "Submit CORD: <source>-<region>.jsonl"
body:
  - type: markdown
    attributes:
      value: |
        Host the file at a public download link, then fill in the fields below. A writer
        downloads it, checks its size and SHA-256 against this issue, and publishes it.
        [Submit a CORD without write access](https://github.com/Senzing/cords/blob/main/development/submit-without-write-access.md)
        has the steps.
  - type: input
    id: file-name
    attributes:
      label: File name
      description: "`<source>-<region>.jsonl`, in lowercase. The region is one of `lasvegas`, `london`, `london_central_a` or `moscow`."
      placeholder: gleif-london.jsonl
    validations:
      required: true
  - type: input
    id: download-url
    attributes:
      label: Download URL
      description: >-
        A public HTTPS URL that `curl -fsSL` downloads without authentication. A Release asset
        on your fork of this repository works, and takes files up to 2 GiB.
      placeholder: https://github.com/<you>/cords/releases/download/<tag>/gleif-london.jsonl
    validations:
      required: true
  - type: input
    id: size
    attributes:
      label: Size in bytes
      description: "The output of `stat -c %s <file>`."
      placeholder: "45162274"
    validations:
      required: true
  - type: input
    id: sha256
    attributes:
      label: SHA-256
      description: "The output of `sha256sum <file>`."
      placeholder: 64 hexadecimal characters
    validations:
      required: true
  - type: textarea
    id: synopsis
    attributes:
      label: Synopsis
      description: For a new file, one or two sentences on what the data is. Shown in the CORD catalog.
  - type: input
    id: primary-source-name
    attributes:
      label: Primary source name
      description: Who publishes the original data, such as "US Dept of Labor Compliance".
  - type: input
    id: primary-source-url
    attributes:
      label: Primary source URL
      placeholder: https://
  - type: input
    id: license
    attributes:
      label: License
      description: The primary source's license. Leave empty if it doesn't state one.
  - type: input
    id: snapshot-date
    attributes:
      label: Snapshot date
      description: When the data was taken from the primary source, as YYYY-MM-DD. Leave empty if unknown.
      placeholder: YYYY-MM-DD
