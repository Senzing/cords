# Check that every released file in manifest.json still matches its sha256:
# the Release asset's digest always, and the senzing.com copy when the entry
# has a source. Fails on any mismatch or missing file.
name: check-releases

on:
  schedule:
    - cron: "23 6 * * 1" # Mondays, 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Verify released files against manifest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .claude/skills/download-senzing-ready/download_senzing_ready.py --verify
