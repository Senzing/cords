name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the minimum in pyproject.toml; 3.12 is the version used locally.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python3 -m pip install .

      - name: Skill tests
        run: |
          for s in upload-senzing-ready publish-cord download-senzing-ready; do
            python3 -m unittest discover -s .claude/skills/$s -p 'test_*.py'
          done

      - name: bin tests
        run: |
          # The bin tests skip without openpyxl; fail instead, so they always run here.
          python3 -c 'import openpyxl'
          python3 -m unittest discover -s bin -p 'test_*.py'

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # The same CLI and version used locally (markdownlint-cli, not markdownlint-cli2).
      - name: Install markdownlint-cli
        run: npm install --global markdownlint-cli@0.48.0

      # Globs are quoted so markdownlint expands them, including ** into .claude/skills/*/.
      - name: markdownlint
        run: markdownlint README.md CHANGELOG.md 'docs/*.md' 'development/*.md' '.claude/*.md' '.claude/**/*.md'
